<style>
  /* ck-theme v1 */
  :root {
    --sky: #FFF7EE; --skyL: #FFE8D6; --yel: #FFD23F; --pink: #F0434F; --pinkL: #FFE1E3;

  .brand { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; color: var(--barInk, var(--ink)); text-align: left; min-height: var(--tap); cursor: pointer; }

  .thRetry small { font-size: 12px; font-weight: 800; margin-top: 2px; }

  .thNone { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; color: #6b7c87; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.35) 0 10px, transparent 10px 20px); }
  .thNone small { font-size: 12px; font-weight: 800; margin-top: 4px; letter-spacing: .2px; }

  .center { text-align: center; }

  /* ---- v7i: sky + pinned note / letter frame ---- */
  .letterWrap, .noteWrap { background: var(--sky, #8FD9C9); }

  .letterFrame, .noteFrame {
    position: relative; z-index: 1;

    box-sizing: border-box;

  @keyframes cardPop {
    0% { transform: scale(.84); opacity: 0; }

    100% { transform: scale(1); }

  @keyframes notePop {
    0% { transform: rotate(-1.6deg) scale(.78); opacity: 0; }

    content: ""; position: absolute; left: 5px; top: 12px; width: 3px; height: 12px;

  .noteSprk {
    position: absolute; top: -16px; right: -12px; width: 52px; height: 52px;
    border-radius: 50%; background:
      radial-gradient(circle at center, #FBF6E8 0 9px, transparent 10px),

    border: 3px solid #13294B; box-shadow: 0 3px 0 #13294B;
    z-index: 4; pointer-events: none; transform: rotate(12deg);

    width: 8px; height: 3px; background: var(--yel, #FFC971); top: 12px; left: 10px; transform: rotate(-30deg);
    box-shadow: 16px 6px 0 #1A3A9C, 8px 18px 0 #fff, 22px 16px 0 var(--yel, #FFC971), 4px 26px 0 #E4572E;

  .noteSprk::after {

      var prev = catsText(typCats(W.type)).trim();
      var orig = (info.categories || []).join('\n').trim();
      if (!cur || cur === prev || cur === orig) W.categories = catsText(typCats(next));
      W.type = next;
    }
    function preview() {
      setVars(palColours(pal(), W.accent));
      var bg = W.removeBg ? '' : (W.bg ? W.bg.preview : existingBg); setBg(root, bg);
    }
    var N = 5;
    function stepsBar() { var h = '<div class="steps">'; for (var i = 1; i <= N; i++) h += '<span class="' + (i <= W.step ? 'on' : '') + '"></span>'; return h + '</div>'; }
    function nav(nextLabel) {
      return '<div class="nav">' + (W.step > (first ? 0 : 1) ? '<button class="btn" data-w="back">\u2190 Back</button>' : (first ? '' : '<a class="btn" href="./">Cancel</a>')) +
        '<button class="btn main" data-w="next">' + (nextLabel || 'Next \u2192') + '</button></div>';
    }
    function render() {
      preview();
      var h = '', e = W.err ? '<div class="err">' + esc(W.err) + '</div>' : '';
      W.err = '';
      if (W.step === 0) {
        h = '<div class="splash" style="min-height:70vh"><div class="lg">' + BOX + '</div><h1>Welcome! \uD83C\uDF89</h1><p>Let\u2019s make this app yours. It takes about 2 minutes: a name, a look, your categories and your PIN. It\u2019s set up for just you; family or a kid can be added later if you like.</p>' +
          '<p class="hint">You can change all of it later.</p><button class="btn main full" data-w="next">Let\u2019s go \u2192</button></div>';
      } else if (W.step === 1) {
        h = '<h1>' + (first ? '1. Name it' : 'Name') + '</h1>' + stepsBar() + e + '<div class="card">' +
          '<label>What do you collect?</label><p class="hint">A couple of example items will match this, so you can see how the app works. You can change it later.</p><div class="types">' +
          TYPES.map(function (tp) { return '<button type="button" data-type="' + esc(tp.key) + '" class="' + (tp.key === W.type ? 'sel' : '') + '">' + esc(tp.label) + '</button>'; }).join('') + '</div>' +
          '<label for="wName">What\u2019s your collection called?</label><input type="text" id="wName" maxlength="40" value="' + esc(W.name) + '" placeholder="e.g. Jo\u2019s Comic Vault">' +
          '<label for="wTag">A short tagline (optional)</label><input type="text" id="wTag" maxlength="60" value="' + esc(W.tagline) + '" placeholder="e.g. Every issue, every variant">' +
          '<label for="wCur">Money in</label><select id="wCur">' + ['\u00A3', '$', '\u20AC', 'A$', 'C$', 'NZ$', '\u00A5', 'kr'].map(function (c) { return '<option' + (c === W.currency ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
          '<label for="wHandle">Your social handle for share pictures (optional)</label><input type="text" id="wHandle" maxlength="40" value="' + esc(W.x.shareHandle) + '" placeholder="e.g. @myshelf"></div>' + nav();
      } else if (W.step === 2) {
        var logoPrev = W.removeLogo ? '' : (W.logo ? W.logo.preview : ''), bgPrev = W.removeBg ? '' : (W.bg ? W.bg.preview : existingBg);
        h = '<h1>' + (first ? '2. Pick a look' : 'Look') + '</h1>' + stepsBar() + e + '<div class="card"><label>Colours</label><div class="sw">' +
          PALS.map(function (p) { return '<button data-pal="' + esc(p.key) + '" class="' + (p.key === W.palette ? 'sel' : '') + '"><i><b style="background:' + ((p.extra && p.extra.navOn) || p.sky) + '"></b><b style="background:' + p.yellow + '"></b><b style="background:' + p.pink + '"></b></i>' + esc(p.label) + '</button>'; }).join('') + '</div>' +
          '<label for="wAcc">Top bar colour (optional)</label><div class="row"><input type="color" id="wAcc" value="' + esc(W.accent || (pal().extra && /^#[0-9a-f]{6}$/i.test(pal().extra.bar || '') ? pal().extra.bar : pal().yellow) || '#FFFFFF') + '" style="width:72px;height:48px;padding:2px">' +
          (W.accent ? '<button class="btn small" data-w="noAccent">Use the theme\u2019s colour</button>' : '<span class="hint">Leave it to use the theme\u2019s colour.</span>') + '</div></div>' +
          '<div class="card"><label>Your logo (optional)</label><div class="pv"><div class="box" style="' + (logoPrev ? 'background-image:url(' + logoPrev + ');border-style:solid' : '') + '">' + (logoPrev ? '' : (t.hasLogo && !W.removeLogo && !first ? '\u2714\uFE0F' : '\uD83D\uDDBC\uFE0F')) + '</div>' +
          '<div class="stack" style="flex:1"><button class="btn small" data-w="pickLogo">' + (logoPrev || (t.hasLogo && !first) ? 'Change logo' : 'Add a logo') + '</button>' + ((logoPrev || (t.hasLogo && !W.removeLogo && !first)) ? '<button class="btn small" data-w="noLogo">Use the Collecson logo</button>' : '') + '</div></div>' +
          '<label>Background picture (optional)</label><p class="hint">A photo of your shelf works great. It\u2019s softened so the writing stays easy to read.</p><div class="pv"><div class="box" style="' + (bgPrev ? 'background-image:url(' + bgPrev + ');border-style:solid' : '') + '">' + (bgPrev ? '' : '\uD83C\uDF04') + '</div>' +
          '<div class="stack" style="flex:1"><button class="btn small" data-w="pickBg">' + (bgPrev ? 'Change picture' : 'Add a picture') + '</button>' + (bgPrev ? '<button class="btn small" data-w="noBg">No picture</button>' : '') + '</div></div></div>' +
          '<input type="file" id="wFile" accept="image/*" hidden>' + nav();
      } else if (W.step === 3) {
        h = '<h1>' + (first ? '3. Your categories' : 'Categories') + '</h1>' + stepsBar() + e + '<div class="card"><p class="hint">One per line. These are the big groups you\u2019ll sort things into, like \u201CFigures\u201D, \u201CComics\u201D or \u201CPins\u201D.</p>' +
          '<textarea id="wCats" aria-label="Categories">' + esc(W.categories) + '</textarea></div>' + nav();
      } else if (W.step === 4) {
        var own = W.users[0], others = W.users.slice(1), hasKid = others.some(function (u) { return u.role === 'Kid'; });
        h = '<h1>' + (first ? '4. You and your PIN' : 'You and your people') + '</h1>' + stepsBar() + e +
          '<div class="card"><label for="wOwner">Your name</label><input type="text" id="wOwner" maxlength="20" value="' + esc(own.name) + '" placeholder="e.g. Sam" autocomplete="given-name">' +
          '<label for="wPin">' + (first ? 'Pick a 4-number PIN' : 'New PIN (leave blank to keep the old one)') + '</label><input type="password" id="wPin" inputmode="numeric" maxlength="4" autocomplete="new-password" value="' + esc(W.pin) + '">' +
          '<label for="wPin2">Type it again</label><input type="password" id="wPin2" inputmode="numeric" maxlength="4" autocomplete="new-password" value="' + esc(W.pin2) + '">' +
          '<p class="hint">The PIN keeps prices and values private and protects these settings. On your own phone you can stay unlocked for 30 days. It\u2019s scrambled before it\u2019s saved, so nobody (not even the sheet) can read it back.</p></div>' +
          (W.showPeople || others.length ?
            '<div class="card"><h2 style="margin-top:0">Family and kids (optional)</h2><p class="hint"><b>Family</b> can add things and photos but never sees money. A <b>Kid</b> gets Kid mode: big buttons, points, badges and jobs, and their photos wait for your OK.</p>' +
            others.map(function (u, k) {
              var i2 = k + 1;
              return '<div class="person"><input type="text" data-un="' + i2 + '" maxlength="20" value="' + esc(u.name) + '" placeholder="Name">' +
                '<select data-ur="' + i2 + '">' + ['Family', 'Kid'].map(function (r) { return '<option' + (r === u.role ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>' +
                '<button class="btn small" data-w="rm" data-i="' + i2 + '" aria-label="Remove ' + esc(u.name || 'person') + '">\u2716</button></div>';
            }).join('') + (W.users.length < 12 ? '<button class="btn small" data-w="addUser">+ Add a person</button>' : '') + '</div>'
            : '<div class="card"><p><b>Just you?</b> Perfect: most people use it on their own, so there\u2019s no \u201Cwho are you?\u201D screen. You can add family or a kid any time from Settings.</p><button class="btn small" data-w="showPeople">+ Add family or a kid (optional)</button></div>') +
          (hasKid ? '<div class="card"><h2 style="margin-top:0">For Kid mode (optional)</h2>' +
            '<label for="wKidTitle">Letter title</label><input type="text" id="wKidTitle" maxlength="100" value="' + esc(W.x.kidLetterTitle) + '" placeholder="e.g. How our collection started">' +
            '<label for="wKidLetter">A letter they see now and then (leave blank for none)</label><textarea id="wKidLetter" maxlength="12000" placeholder="Write it like a note. Leave a blank line between paragraphs.">' + esc(W.x.kidLetter) + '</textarea>' +
            '<label for="wKidNotes">Little notes, one per line (blank = friendly ones we wrote)</label><textarea id="wKidNotes" maxlength="12000" placeholder="Proud of you!">' + esc(W.x.kidNotes) + '</textarea>' +
            '<label class="row" style="gap:8px;align-items:center"><input type="checkbox" id="wKidFun"' + (W.x.kidFunWorth ? ' checked' : '') + ' style="width:22px;height:22px"> Show a fun \u201Cwhat\u2019s it worth?\u201D card in ice creams, dogs and pizzas (never real money)</label></div>' : '') +
          nav();
      } else if (W.step === 5) {
        var p = pal();
        h = '<h1>' + (first ? '5. All good?' : 'Check and save') + '</h1>' + stepsBar() + e + '<div class="card stack">' +
          '<p><b>' + esc(W.name) + '</b>' + (W.tagline ? '<br><span class="hint">' + esc(W.tagline) + '</span>' : '') + '</p>' +
          (typ(W.type) ? '<p>Collection type: <b>' + esc(typ(W.type).label) + '</b></p>' : '') +
          '<p>Look: <b>' + esc(p.label || W.palette) + '</b>' + (W.accent ? ' with a custom top bar' : '') + (W.logo ? ', new logo' : '') + (W.bg ? ', background picture' : '') + '</p>' +
          '<p>Categories: ' + esc(cats().slice(0, 8).join(', ')) + (cats().length > 8 ? ' and ' + (cats().length - 8) + ' more' : '') + '</p>' +
          '<p>' + (W.users.filter(function (u) { return u.name; }).length <= 1 ? 'Just you: <b>' + esc(W.users[0].name) + '</b>' : 'People: ' + W.users.filter(function (u) { return u.name; }).map(function (u) { return esc(u.name) + ' (' + u.role + ')'; }).join(', ')) + '</p></div>' +
          '<div class="nav"><button class="btn" data-w="back">\u2190 Back</button><button class="btn green" data-w="save">' + (first ? '\u2705 Finish setup' : '\u2705 Save changes') + '</button></div>';
      }
      show(h);
    }
    function cats() { return W.categories.split(/\n|,/).map(function (s) { return s.trim(); }).filter(Boolean); }
    function grab() {
      if ($('wName')) { W.name = $('wName').value.trim(); W.tagline = $('wTag').value.trim(); W.currency = $('wCur').value; W.x.shareHandle = $('wHandle').value.trim(); }
      if ($('wOwner')) W.users[0].name = $('wOwner').value.trim();
      if ($('wKidLetter')) { W.x.kidLetterTitle = $('wKidTitle').value.trim(); W.x.kidLetter = $('wKidLetter').value; W.x.kidNotes = $('wKidNotes').value; W.x.kidFunWorth = $('wKidFun').checked; }
      if ($('wCats')) W.categories = $('wCats').value;
      document.querySelectorAll('[data-un]').forEach(function (el) { W.users[+el.getAttribute('data-un')].name = el.value.trim(); });
      document.querySelectorAll('[data-ur]').forEach(function (el) { W.users[+el.getAttribute('data-ur')].role = el.value; });
      if ($('wPin')) { W.pin = $('wPin').value; W.pin2 = $('wPin2').value; }
    }
    function check() {
      if (W.step === 1 && first && !W.type) return 'Pick what you collect (you can change it later).';
      if (W.step === 1 && !W.name) return 'Give your collection a name first.';
      if (W.step === 3 && !cats().length) return 'Add at least one category (you can change them later).';
      if (W.step === 4) {
        var named = W.users.filter(function (u) { return u.name; });
        var owners = named.filter(function (u) { return u.role === 'Owner'; });
        if (!W.users[0].name) return 'Type your name first.';
        if (owners.length !== 1) return 'Pick exactly one Owner (the person who can see prices and values).';
        var low = named.map(function (u) { return u.name.toLowerCase(); });
        if (low.some(function (n, i) { return low.indexOf(n) !== i; })) return 'Two people have the same name. Give each a different one.';
        if (first || W.pin || W.pin2) {
          if (!/^\d{4}$/.test(W.pin)) return 'The PIN needs to be exactly 4 numbers.';
          if (W.pin !== W.pin2) return 'The two PINs don\u2019t match.';
          if (/^(\d)\1{3}$/.test(W.pin) || W.pin === '1234') return 'Pick a PIN that\u2019s harder to guess.';
        }
      }
      return '';
    }
    function shrink(file, max, type, q) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
          var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
          var d = c.toDataURL(type, q); resolve({ mime: type, b64: d.split(',')[1], preview: d });
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That picture wouldn\u2019t open. Try a different one.')); };
        img.src = url;
      });
    }
    var picking = '';
    root.onchange = function (ev) {
      if (ev.target.id === 'wAcc') { W.accent = ev.target.value; render(); return; }
      if (ev.target.id !== 'wFile' || !ev.target.files[0]) return;
      var f = ev.target.files[0], isLogo = picking === 'logo';
      shrink(f, isLogo ? 256 : 1280, isLogo ? 'image/png' : 'image/jpeg', 0.74).then(function (img) {
        if (isLogo) { if (img.b64.length > 90000) return shrink(f, 160, 'image/jpeg', 0.85).then(function (j) { W.logo = j; W.removeLogo = false; render(); }); W.logo = img; W.removeLogo = false; }
        else { W.bg = img; W.removeBg = false; }
        render();
      }).catch(function (e) { W.err = e.message; render(); });
    };
    root.onclick = function (ev) {
      var pb = ev.target.closest('[data-pal]');
      if (pb) { W.palette = pb.getAttribute('data-pal'); render(); return; }
      var tb = ev.target.closest('[data-type]');
      if (tb) { applyTypeCats(tb.getAttribute('data-type')); render(); return; }
      var b = ev.target.closest('[data-w]'); if (!b) return;
      var a = b.getAttribute('data-w');
      grab();
      if (a === 'next') { var er = W.step ? check() : ''; if (er) { W.err = er; } else W.step++; render(); }
      else if (a === 'back') { W.step--; render(); }
      else if (a === 'pickLogo' || a === 'pickBg') { picking = a === 'pickLogo' ? 'logo' : 'bg'; var fi = $('wFile'); fi.value = ''; fi.click(); }
      else if (a === 'noLogo') { W.logo = null; W.removeLogo = true; render(); }
      else if (a === 'noBg') { W.bg = null; W.removeBg = true; render(); }
      else if (a === 'noAccent') { W.accent = ''; render(); }
      else if (a === 'addUser') { W.users.push({ name: '', role: 'Family' }); render(); }
      else if (a === 'showPeople') { W.showPeople = true; W.users.push({ name: '', role: 'Family' }); render(); }
      else if (a === 'rm') { W.users.splice(+b.getAttribute('data-i'), 1); render(); }
      else if (a === 'save') save();
    };
    function save() {
      var data = { name: W.name, tagline: W.tagline, palette: W.palette, accent: W.accent, currency: W.currency, collectionType: W.type, categories: cats(),
        users: W.users.filter(function (u) { return u.name; }), pin: W.pin, logo: W.logo ? { mime: W.logo.mime, b64: W.logo.b64 } : null,
        bg: W.bg ? { mime: W.bg.mime, b64: W.bg.b64 } : null, removeLogo: W.removeLogo, removeBg: W.removeBg,
        shareHandle: W.x.shareHandle, kidFunWorth: !!W.x.kidFunWorth, kidLetterTitle: W.x.kidLetterTitle, kidLetter: W.x.kidLetter, kidNotes: W.x.kidNotes };
      if (!first && !info.extras) ['shareHandle', 'kidFunWorth', 'kidLetterTitle', 'kidLetter', 'kidNotes'].forEach(function (k) { delete data[k]; });   // never blank what we couldn't read
      show('<div class="splash"><div class="spin"></div><p>Saving your settings\u2026</p></div>');
      (first ? post('setupCollection', [data]) : post('saveSettings', [data, L.get('dadToken')])).then(function (r) {
        L.del('theme');
        if (r && r.token) { L.set('dadToken', r.token.token); L.set('dadTokenExp', String(r.token.expires)); }
        if (first) { L.set('role', r.owner); }
        var ex = r && r.examples, typLabel = (typ(W.type) && typ(W.type).label) || 'items';
        var homeHint = first ? '<p>Next: add it to your home screen so it\u2019s one tap away.</p><div class="card stack" style="text-align:left"><p><b>Android (Chrome):</b> tap \u22EE (top right) \u2192 <b>Install app</b> or <b>Add to Home screen</b>.</p><p><b>iPhone (Safari):</b> tap the Share button \u2192 <b>Add to Home Screen</b>.</p></div>' : '';
        var swapped = !first && ex && ex.items && ex.items.length;
        var offer = (first && ex && ex.items && ex.items.length) || swapped;
        function openApp() { location.replace(location.pathname + '?api=' + encodeURIComponent(API)); }
        function showDone(extra) {
          show('<div class="splash"><div style="font-size:64px">\uD83C\uDF89</div><h1>' + (first ? 'You\u2019re all set!' : 'Saved!') + '</h1>' +
            (extra || '') + homeHint +
            '<button class="btn main full" id="ckDone">Open my app \u2192</button></div>');
          $('ckDone').onclick = openApp;
        }
        if (offer) {
          var n = ex.items.length;
          var lead = first
            ? '<p>I\u2019ve added ' + n + ' example ' + esc(typLabel.toLowerCase()) + ' so you can look around. Keep them, edit them, or remove them now.</p>'
            : '<p>I\u2019ve swapped the example items to match <b>' + esc(typLabel) + '</b>.</p>';
          show('<div class="splash" style="min-height:auto"><div style="font-size:64px">\uD83C\uDF89</div><h1>' + (first ? 'You\u2019re all set!' : 'Saved!') + '</h1>' + lead +
            '<div class="card stack" style="text-align:left"><ul>' + ex.items.map(function (nm) { return '<li>' + esc(nm) + '</li>'; }).join('') +
            (ex.wanted ? '<li>Wanted: ' + esc(ex.wanted) + '</li>' : '') +
            (ex.checklist ? '<li>A small example checklist</li>' : '') + '</ul></div>' +
            '<button class="btn main full" id="ckKeep">Keep the examples</button>' +
            '<button class="btn full" id="ckWipe">Remove example items</button></div>');
          $('ckKeep').onclick = function () { showDone(first ? '' : ''); };
          $('ckWipe').onclick = function () {
            show('<div class="splash"><div class="spin"></div><p>Removing the examples\u2026</p></div>');
            post('removeExampleItems', [L.get('dadToken')]).then(function () {
              showDone('<p>The example items are gone. You can add your own things whenever you\u2019re ready.</p>');
            }).catch(function (e) { showDone('<p class="hint">' + esc(e.message) + '</p>'); });
          };
        } else showDone();
      }).catch(function (e) { W.err = e.message; W.step = 5; render(); });
    }
    render();
  }

  if ('serviceWorker' in navigator) {
    var had = !!navigator.serviceWorker.controller, reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (had && !reloaded) { reloaded = true; location.reload(); } });
    // the browser checks sw.js for updates by itself on each visit; no manual reg.update() (it raced the first install)
    navigator.serviceWorker.register('./sw.js').catch(function () { /* offline or unsupported: the app still works */ });
  }
  main();
})();
  </script>
